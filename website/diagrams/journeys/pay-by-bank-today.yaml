# yaml-language-server: $schema=../schemas/journey.schema.json
# $schema: ../schemas/journey.schema.json
#
# Pay by Bank today: one journey on Design > Journeys > All Journeys.
# Change the words after the colons. Keep the indenting as it is.
# How to edit, and what each field means: website/diagrams/README.md

title: Pay by Bank today
eyebrow: Immediate payment, bank confirmation
kind: customer

origin:
  actor: Cardmember
  channels:
    - Web
    - Mobile app
  note: Which payment methods need bank confirmation is a market setting, resolved per request.

entry:
  - kind: function
    label: CreatePayment.v3
  - kind: function
    label: CreateConfirmPendingPayment.v1
    note: once the customer is back; answers with the status
  - kind: function
    label: CreateBillpaySettlementEvent.v1
    note: M3's notice, passed on to Billpay

core:
  - kind: api
    label: POST /payments
  - kind: api
    label: POST /payments/{payment-id}/confirm
  - kind: api
    label: POST /payments/{payment-id}/settlement
    note: M3's notice, through One-Data

workflow:
  - label: CreatePaymentIntentWorkflow

steps:
  - name: Capture
    state: PENDING
    mode: live
    arrives: create

  - name: Own checks
    state: PENDING
    mode: live
    caption: Amex's own checks, before the bank step
    systems:
      - Payment Options
    exit:
      state: DECLINED

  - name: Redirect
    state: PENDING
    mode: live
    caption: replies PENDING with the redirect link
    reply: to the caller with PENDING and the redirect link
    systems:
      - Amex PwBT
    exit:
      state: DECLINED
      label: no link

  - name: Customer back
    state: PENDING
    mode: live
    caption: asks GET /payment-status once and replies with the status
    trigger:
      kind: update
      name: Channel Confirm Event
      label: the channel's call once the payer's bank routes the customer back
    reply: to the channel with PENDING, ACCEPTED or DECLINED
    systems:
      - Amex PwBT
    exit:
      state: DECLINED
      label: failed

  - name: While pending
    state: ACCEPTED
    mode: background
    caption: GET /payment-status, the gap doubling from 2 to 30 minutes
    poll:
      label: GET /payment-status
      note: >-
        Amex Pay with Bank Transfer, asked again with a gap that doubles from 2 to 30 minutes, until
        it answers success or failure
    exit:
      - state: DECLINED
        label: failed
      - state: DECLINED
        label: no answer in 24 to 48 h
      - state: CANCELLED
        label: the customer's no

  - name: Settled
    state: ACCEPTED
    mode: awaiting
    caption: M3's notice, through One-Data, that the bank has settled the money
    trigger:
      kind: signal
      name: Bank Settled Event via M3
      label: >-
        M3's notice, through One-Data's CreateBillpaySettlementEvent.v1, that the bank has settled
        the money
    exit:
      - label: "no notice: exception list"
      - label: "failed: exception list"

  - name: Execute
    state: PROCESSING
    mode: background
    caption: no clearing call
    systems:
      - GAR
      - CAS
      - Payment Instruments

  - name: Fulfil
    state: PROCESSED
    mode: background
    systems:
      - Accounting
      - TFNE
      - GPHDB
      - AMP

  - name: Paid
    state: PAID
    mode: awaiting
    caption: settled and posted
    trigger:
      kind: events
      name: Posted Event from GAR
      label: Accounts Receivable's posting, which One-Data pairs with M3's settlement
    exit:
      state: RETURNED

detail:
  - step: 1
    text: >-
      Billpay writes the payment and its idempotency key in one insert-if-absent, as for any
      payment. A repeated request joins the workflow that is already running.
  - step: 2
    text: >-
      The market's `requiresBankConfirmation` behavior resolves to Y for this payment method, so the
      Router starts `CreatePaymentIntentWorkflow`. Amex's own check comes first, before the bank
      step: Payment Options' `ReadPaymentOptionByIdentifier.v1` confirms the option the customer
      picked. A bank payment makes no call to Payment Instruments or Plans here. A payment that
      fails the check is `DECLINED` at once, with no redirect link.
  - step: 3
    text: >-
      RequestConfirmation asks Amex Pay with Bank Transfer for the customer's redirect link and
      stores it on the payment. Billpay never calls a market's provider itself. The caller gets
      `PENDING` with the link, and the `PENDING` event goes to RTF. If no link comes back, the
      payment is `DECLINED` instead.
  - step: 4
    text: >-
      The customer approves the payment at their bank, and the payer's bank routes them back to the
      channel. The channel then calls `CreateConfirmPendingPayment.v1`, which reaches billpay-online
      as `POST /payments/{payment-id}/confirm`, an update to the workflow: the Channel Confirm
      Event. Verify asks Amex Pay with Bank Transfer's `GET /payment-status` once and the update
      replies with the answer. Success commits `ACCEPTED`, and failure commits `DECLINED` with
      `BANK_CONFIRMATION_DECLINED` (the code is Proposed). Pending, or a call that times out or
      fails, is `PENDING`. The channel shows the customer that status, and its part ends there: the
      customer sees the final state later in their list of payments, which the channel reads through
      `ReadPayments.v1`. If the channel never calls, Billpay waits 2 minutes (still TBD) and starts
      asking anyway.
  - text: Everything after this runs with nobody waiting, in the same workflow.
  - step: 5
    text: >-
      While the answer is pending, the workflow asks again with a gap that backs off: 2 minutes,
      then 4, 8 and 16, then every 30 minutes, until the answer is success or failure. The asking
      stops once the market's wait of 24 to 48 hours has passed since the create, and a payment
      still pending is `DECLINED` with `CONFIRMATION_NOT_RECEIVED`. The status call's timeout is
      still to be set. The customer can still say no at any point until the payment is decided, and
      it ends `CANCELLED`. Until then, the payment's pending entry blocks the account's next
      payment.
  - step: 6
    text: >-
      An `ACCEPTED` payment waits for the money to settle. Once the bank settles it in real time, it
      tells Amex; M3 intercepts that message and calls One-Data's `CreateBillpaySettlementEvent.v1`,
      and One-Data calls billpay-online's `POST /payments/{payment-id}/settlement`, which signals
      the workflow: the Bank Settled Event via M3. If M3's notice arrives before the status says
      success, Billpay accepts the payment on it, stops asking, and logs it. If the notice never
      comes, the payment goes on the exception list with an alert; how long Billpay waits is still
      TBD. If M3 says the settlement failed, because Amex never received the money from the payer's
      bank, the payment stays `ACCEPTED`, nothing executes, and a manual exception process moves it
      later.
  - step: 7
    text: >-
      Execute makes no clearing call, since the money moved at the bank. The statement balance goes
      down in Accounts Receivable and available credit up in CAS, at once. CAS waits for the
      instrument's clear-text details from Payment Instruments.
  - step: 8
    text: >-
      Accounting, TFNE, GPHDB and AMP, which hears that the payment has executed, then `PROCESSED`.
      A bank payment makes no eBNC, risk or B2Notifier call here, and sends no RTF event or Raven
      message for `PROCESSED`.
  - step: 9
    text: >-
      `PAID` follows with the Posted Event from GAR, Accounts Receivable's posting. M3's notice, in
      since step 6, is this payment's settlement, and One-Data keeps it for the pairing when it
      passes the notice on (Proposed).

reference:
  to: /docs/design/sequence-diagrams#14-pay-by-bank-create-status-and-settlement
  label: Sequence diagram
