# yaml-language-server: $schema=../schemas/journey.schema.json
# $schema: ../schemas/journey.schema.json
#
# A third party pushes a payment: one journey on Design > Journeys > All Journeys.
# Change the words after the colons. Keep the indenting as it is.
# How to edit, and what each field means: website/diagrams/README.md

title: A third party pushes a payment
kind: system

origin:
  actor: A third party
  channels:
    - A pushed payment

entry:
  - kind: function
    label: CreateInboundPayment.v1
  - kind: inbox
    label: One-Data's inbox

core:
  - kind: dispatcher
    label: Inbound dispatcher

workflow:
  - label: ProcessInboundPaymentWorkflow

steps:
  - name: Capture
    state: PENDING
    mode: background

  - name: Verify
    state: ACCEPTED
    mode: background
    caption: will Amex take it
    exit:
      state: DISALLOWED

  - name: Execute
    state: PROCESSING
    mode: background
    caption: no clearing call
    systems:
      - GAR
      - Payment Instruments
      - CAS

  - name: Fulfil
    state: PROCESSED
    mode: background
    systems:
      - Accounting
      - eBNC
      - Risk
      - TFNE
      - GPHDB
      - B2Notifier
      - AMP
      - RTF
      - Raven

  - name: Paid
    state: PAID
    mode: awaiting
    caption: posted
    trigger:
      kind: events
      name: Posted Event from GAR
      label: >-
        Accounts Receivable's posting. The settlement is known, so the posting alone pays the
        payment, or each leg
    systems:
      - GAR
    exit:
      state: RETURNED

detail:
  - text: >-
      One-Data stores the payment and replies 202 straight away. The inbound dispatcher checks the
      inbox every minute and starts the workflow through the Router at the governor's pace.
  - step: 1
    text: Recorded once. Third parties retry, so the idempotency check matters here.
  - step: 2
    text: >-
      A payment American Express doesn't accept ends at `DISALLOWED`. That state exists only on this
      journey.
  - step: 3
    text: >-
      An inbound payment makes no clearing call. Execute applies it in Accounts Receivable and CAS,
      and hands One-Data no settlement event: the third party has already sent the money, so the
      settlement is known.
  - text: >-
      One inbound payment can be split across several card accounts, each leg running
      `ExecuteSplitPaymentWorkflow`. A consumer's or business travel account's request names the
      card accounts and how much each takes, as a list of legs, tens of them and fewer than 100; the
      legs must add up exactly to the amount, or the request is `REJECTED`. A corporate one gets its
      split from the allocations manager, as a [corporate payment](#pay-a-corporate-bill-today)
      does, and its parent only releases the legs. The parent sends nothing once its legs finish:
      every message goes out per leg.
  - text: >-
      Past that, it is an ordinary payment, with no wait for a date: one dated after its submit date
      still runs at once. Every downstream system is told, and it turns `PAID` once Accounts
      Receivable's posting is in.

reference:
  to: /docs/design/sequence-diagrams#9-inbound-payment
  label: Sequence diagram
