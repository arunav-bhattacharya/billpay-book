# yaml-language-server: $schema=../schemas/journey.schema.json
# $schema: ../schemas/journey.schema.json
#
# A payment is paid: one journey on Design > Journeys > All Journeys.
# Change the words after the colons. Keep the indenting as it is.
# How to edit, and what each field means: website/diagrams/README.md

title: A payment is paid
eyebrow: Settlement and posting
kind: system

origin:
  channels:
    - MR/M3 settled
    - GAR posted

entry:
  - kind: event
    label: Event handlers
  - kind: inbox
    label: One-Data's inbox

core:
  - kind: schedule
    label: Every 30 seconds

workflow:
  - label: ProcessPaidEventsWorkflow

steps:
  - name: Fetch
    mode: background
    caption: up to 500 READY rows

  - name: Settle
    state: PAID
    mode: background
    caption: one Oracle transaction

  - name: Announce
    mode: background
    caption: the PAID events
    systems:
      - RTF

  - name: Mark
    mode: background
    caption: DONE or UNMATCHED

detail:
  - text: >-
      A payment reaches this point `PROCESSED`: the money has gone to the bank and every system has
      been told. Two confirmations are still owed. The bank says the money settled, and Accounts
      Receivable says the payment posted. For a debit card payment, the settlement is the one
      Billpay created in Execute; for Pay with Bank Transfer, it is M3's settled notice.
  - text: >-
      Both arrive as events, sometimes 1,000 a second, and neither touches Billpay directly.
      One-Data's event handlers store each one in its inbox, a Postgres database of its own, and
      whichever arrives second marks the payment's row `READY`.
  - step: 1
    text: >-
      A Schedule starts `ProcessPaidEventsWorkflow` every 30 seconds, and only one run is ever
      active. Each batch fetches up to 500 `READY` rows through a One-Data function.
  - step: 2
    text: >-
      Settle moves the batch from `PROCESSED` to `PAID` in one Oracle transaction, each row by a
      guarded update, and tags each `PAID` timeline row with the batch's ID. A retried Settle finds
      the payments it already moved by that ID.
  - step: 3
    text: The `PAID` events go to RTF.
  - step: 4
    text: >-
      Last, the rows are marked `DONE`, or `UNMATCHED` when Billpay found nothing ready to pay. An
      `UNMATCHED` row is tried again an hour later, for up to 48 hours, and after that One-Data's
      own scheduled check, `UpdateUnmatchedPayments.v1`, raises an alert. Marking last means a row
      is `DONE` only once its event has gone out.
  - text: >-
      A split payment turns `PAID` leg by leg: a leg is ready once it has posted and its settlement
      is in. A corporate leg takes its parent's settlement, and a consumer split's leg settles on
      its own. The parent stays where it was: `PROCESSED` for a corporate payment, `ACCEPTED` for a
      consumer split.
  - text: >-
      The drain is the last thing the governor gives budget to, so a burst of events waits in the
      inbox rather than competing with execution. If a confirmation never arrives,
      `ProcessMissingPaidEventsWorkflow` finds payments still `PROCESSED` after 48 hours, asks MR/M3
      and GAR, and hands any event it finds to One-Data, or raises an alert. It doesn't ask MR/M3
      about a debit card payment, which MR/M3 never settles: it asks GAR alone, and always hands
      over Billpay's own settlement event again, since Billpay can't read the inbox (Proposed). For
      Pay with Bank Transfer, M3's notice is the settlement, and how it reaches the pairing is open.

reference:
  to: /docs/design/sequence-diagrams#10-paid-events
  label: Sequence diagram
