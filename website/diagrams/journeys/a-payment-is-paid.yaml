# yaml-language-server: $schema=../schemas/journey.schema.json
# $schema: ../schemas/journey.schema.json
#
# A payment is paid: one journey on Design > Journeys > All Journeys.
# Change the words after the colons. Keep the indenting as it is.
# How to edit, and what each field means: website/diagrams/README.md

title: A payment is paid
eyebrow: Settlement and posting
kind: system

origin:
  channels:
    - MR/M3 settled
    - GAR posted

entry:
  - kind: event
    label: Event handlers
  - kind: inbox
    label: One-Data's inbox

core:
  - kind: schedule
    label: Every 30 seconds

workflow:
  - label: ProcessPaidEventsWorkflow

steps:
  - name: Fetch
    mode: background
    caption: up to 500 READY rows, over JDBC

  - name: Settle
    state: PAID
    mode: background
    caption: pairs the events; one Oracle transaction

  - name: Announce
    mode: background
    caption: the PAID events
    systems:
      - RTF

  - name: Mark
    mode: background
    caption: DONE, WAITING or UNMATCHED

detail:
  - text: >-
      A payment reaches this point `PROCESSED`: the money has gone to the bank and every system has
      been told. Accounts Receivable still has to say the payment posted, and, unless the settlement
      is known, the bank has to say the money settled. A debit card, MR Points or inbound payment,
      and its legs, has a known settlement, because its money moved at the card authorization, the
      points redemption or the third party's push. For Pay with Bank Transfer, the settlement is
      M3's notice.
  - text: >-
      The events arrive at One-Data, sometimes 1,000 a second, and none touches Billpay directly.
      One-Data only stores: each handler writes the event to its inbox, a Postgres database of its
      own, fills its time on the payment's, or leg's, row, and marks the row `READY`. That now means
      an event came in for Billpay to look at. Billpay decides `PAID`.
  - step: 1
    text: >-
      A Schedule starts `ProcessPaidEventsWorkflow` every 30 seconds, and only one run is ever
      active. Each batch reads up to 500 `READY` rows from One-Data's table itself, over JDBC,
      through billpay-offline's own pool. There is no One-Data function in between.
  - step: 2
    text: >-
      Settle pairs the events. A row with the posting and a settlement is paid, and so is one with
      the posting alone where the settlement is known; its settlement time is then when the payment
      turned `PROCESSING`. A corporate leg reads its payment's settlement. Each paid row is a
      guarded update from `PROCESSED` to `PAID` in one Oracle transaction, and each `PAID` timeline
      row is tagged with the batch's ID, so a retried Settle finds the payments it already moved.
  - step: 3
    text: The `PAID` events go to RTF.
  - step: 4
    text: >-
      Last, the rows are marked: `DONE` for a payment now `PAID`, `WAITING` when an event is still
      missing, and `UNMATCHED` when the row could be paid but its payment isn't `PROCESSED`. Each
      mark is guarded on what Billpay read, so an event that came in meanwhile leaves the row
      `READY` for the next batch. An `UNMATCHED` row is tried again an hour later, for up to 48
      hours, and after that Billpay's gauge, `billpay_paid_unmatched_stale`, raises an alert.
      Marking last means a row is `DONE` only once its event has gone out.
  - text: >-
      A split payment turns `PAID` leg by leg. A corporate leg pays once it has posted and its
      parent's settlement is in; when the parent's settlement comes after a leg's posting, the drain
      wakes the legs that were waiting. A consumer split's leg settles on its own, and an inbound
      payment's leg pays on its posting alone. The parent stays where it was: `PROCESSED` for a
      corporate payment, `ACCEPTED` for a consumer split.
  - text: >-
      The drain is the last thing the governor gives budget to, so a burst of events waits in the
      inbox rather than competing with execution. If a confirmation never arrives,
      `ProcessMissingPaidEventsWorkflow` finds payments still `PROCESSED` after 48 hours, asks MR/M3
      and GAR, and hands any event it finds to One-Data, or raises an alert. Where the settlement is
      known, and for Pay with Bank Transfer, it asks GAR alone, and it never hands over a settlement
      event of Billpay's.

reference:
  to: /docs/design/sequence-diagrams#10-paid-events
  label: Sequence diagram
