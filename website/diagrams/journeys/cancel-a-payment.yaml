#
# Cancel a payment: one journey on Design > Journeys > All Journeys.
# Change the words after the colons. Keep the indenting as it is.
# How to edit, and what each field means: website/diagrams/README.md

title: Cancel a payment
kind: customer

origin:
  actor: Cardmember
  channels:
    - Web
    - Mobile app
    - Servicing rep

entry:
  - kind: function
    label: DeletePayment.v1

core:
  - kind: api
    label: DELETE /payments/{payment-id}

workflow:
  - label: CancelPaymentWorkflow

steps:
  - name: Check
    mode: live
    caption: window and eligibility
    exit:
      label: 409 outside the window

  - name: Cancel
    state: CANCELLED
    mode: live
    caption: replies CANCELLED
    reply: to the caller with CANCELLED

detail:
  - step: 1
    text: >-
      Read-only calls check the cancellation window, which always closes before execution starts,
      and whether the payment is still eligible.
  - step: 2
    text: >-
      One guarded update moves the payment to `CANCELLED`, and the same commit cancels its Work
      Tracker rows, so no dispatcher will ever pick it up. The `CANCELLED` event and message go out
      after the reply.
  - text: >-
      If the update changes nothing, the payment has moved on. When it is already `CANCELLED`, the
      caller gets that answer again, so cancelling twice is harmless. Otherwise the answer is 409.
  - text: >-
      A corporate payment whose allocations have been requested is `ALLOCATING`, not `SCHEDULED`, so
      the update changes nothing and the answer is 409, the same as outside the window.
  - text: >-
      There is no path from `ACCEPTED` to `CANCELLED`, so the window is the only chance to pull a
      payment back.

reference:
  to: /docs/design/sequence-diagrams#6-cancel-a-payment
  label: Sequence diagram
