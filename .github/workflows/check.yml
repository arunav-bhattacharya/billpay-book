name: Check a pull request

# Every pull request gets the same checks the deploy runs, so a mistake in a
# diagram file shows up on the pull request, in plain words, before it can
# reach the site.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  check:
    name: Diagrams and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the diagram files
        run: npm run check:diagrams

      - name: Build the site
        run: npm run build
